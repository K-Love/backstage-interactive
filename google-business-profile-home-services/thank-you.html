<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10183a">
  <title>Video audit requested | Backstage Interactive</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #10183a;
      color: #fff;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.55;
    }
    .skip {
      position: absolute;
      left: 0.75rem;
      top: -4rem;
      background: #fff;
      color: #10183a;
      font-weight: 800;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      text-decoration: none;
    }
    .skip:focus { top: 0.75rem; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    header {
      background: #fff;
      border-bottom: 4px solid #ff6b35;
    }
    .bar {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      min-height: 4.25rem;
      display: flex;
      align-items: center;
    }
    .brand img { display: block; width: 168px; height: auto; }
    main {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }
    p { margin: 1rem 0 0; color: #e4e9f7; max-width: 38rem; }
    a.back {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      width: auto;
      max-width: 100%;
      min-height: 48px;
      margin-top: 1.5rem;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      background: #ff6b35;
      color: #1a140c;
      font-weight: 800;
      text-decoration: none;
    }
    a.back:hover { background: #f25a22; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="bar">
      <a class="brand" href="/google-business-profile-home-services">
        <img src="/assets/bi-logo.png" alt="Backstage Interactive" width="200" height="51">
      </a>
    </div>
  </header>
  <main id="main">
    <h1>Got it. Your video audit is on the way within 2 business days.</h1>
    <p>No obligation. You keep the video either way.</p>
    <a class="back" href="/google-business-profile-home-services">Back to GBP Fix-and-Protect</a>
  </main>
</body>
</html>
