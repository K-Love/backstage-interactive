[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The retired launch placeholder must never be served again.
# Legacy bookmarks resolve permanently to the current flagship homepage.
[[redirects]]
  from = "/coming-soon.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/coming-soon"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/coming-soon/"
  to = "/"
  status = 301
  force = true
