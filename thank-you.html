<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07070f">
  <meta name="color-scheme" content="dark">
  <title>Note received | Backstage Interactive</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/cormorant-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Cormorant";
      src: url("/assets/fonts/cormorant-latin.woff2") format("woff2");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 60% 50% at 70% 0%, rgba(46, 49, 146, 0.35), transparent 60%),
        #07070f;
      color: #efedf6;
      font: 1.0625rem/1.65 Inter, system-ui, sans-serif;
    }
    main { width: min(40rem, calc(100% - 2.5rem)); padding: 4.5rem 0; }
    p.kicker {
      margin: 0;
      color: #a7a6bc;
      font-size: 0.75rem;
      font-weight: 560;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.7rem 0 1rem;
      font-family: Cormorant, Georgia, serif;
      font-weight: 520;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    p { margin: 0; max-width: 36rem; color: #c4c3d4; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 1.5rem;
      padding: 0.65rem 1.15rem;
      background: #2e3192;
      color: #fff;
      text-decoration: none;
      font-weight: 560;
    }
    a:focus-visible { outline: 3px solid #c9ccff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Backstage Interactive</p>
    <h1>Thank you.</h1>
    <p>The note is in. I read every one, and I reply by email when it’s a fit.</p>
    <a href="/">Back to the studio</a>
  </main>
</body>
</html>
