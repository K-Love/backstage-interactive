<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07070f">
  <meta name="color-scheme" content="dark light">
  <script src="/assets/theme-preference.js"></script>
  <title>Note received | Backstage Interactive</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/cormorant-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Cormorant";
      src: url("/assets/fonts/cormorant-latin.woff2") format("woff2");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --bg: #07070f;
      --ink: #efedf6;
      --muted: #c4c3d4;
      --faint: #a7a6bc;
      --link: #c9ccff;
      --beam: rgba(46, 49, 146, 0.35);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f5f0;
      --ink: #182134;
      --muted: #37445a;
      --faint: #506078;
      --link: #343786;
      --beam: rgba(46, 49, 146, 0.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 60% 50% at 70% 0%, var(--beam), transparent 60%),
        var(--bg);
      color: var(--ink);
      font: 1.0625rem/1.65 Inter, system-ui, sans-serif;
    }
    .theme-bar {
      display: flex;
      justify-content: flex-end;
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding-top: 1rem;
    }
    .theme-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 44px;
      padding: 0.45rem 0.75rem;
      border: 1px solid #454769;
      border-radius: 99px;
      background: #101018;
      color: #efedf6;
      font: 560 0.8rem Inter, system-ui, sans-serif;
      cursor: pointer;
    }
    html[data-theme] .theme-toggle { display: inline-flex; }
    .theme-toggle:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
    .theme-symbol { font-size: 1.12rem; line-height: 1; }
    :root[data-theme="light"] .theme-toggle {
      border-color: rgba(24, 33, 52, 0.5);
      color: var(--ink);
      background: #fffdf9;
    }
    main {
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4.5rem 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    p.kicker {
      margin: 0;
      color: var(--faint);
      font-size: 0.75rem;
      font-weight: 560;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.7rem 0 1rem;
      font-family: Cormorant, Georgia, serif;
      font-weight: 520;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    p { margin: 0; max-width: 36rem; color: var(--muted); }
    a.back {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      min-height: 48px;
      margin-top: 1.5rem;
      padding: 0.65rem 1.15rem;
      background: #2e3192;
      color: #fff;
      text-decoration: none;
      font-weight: 560;
    }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
    .policies {
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 0 0 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.1rem;
    }
    .policies a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--link);
      font-weight: 560;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <header class="theme-bar">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode">
      <span class="theme-symbol" aria-hidden="true">☼</span>
      <span class="theme-label">Light mode</span>
    </button>
  </header>
  <main>
    <p class="kicker">Backstage Interactive</p>
    <h1>Thank you.</h1>
    <p>The note is in. I read every one, and I reply by email when it’s a fit.</p>
    <a class="back" href="/">Back to the studio</a>
  </main>
  <footer>
    <nav class="policies" aria-label="Policies">
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </footer>
</body>
</html>
